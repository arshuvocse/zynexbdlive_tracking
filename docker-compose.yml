services:
  api:
    build:
      context: ./LiveTrackingSystem/LiveTracking.Api
      dockerfile: Dockerfile
    container_name: live_tracking_api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\MSSQLSERVER2019;Database=LiveTrackingDB;User Id=sa;Password=sa1234;TrustServerCertificate=True;MultipleActiveResultSets=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
